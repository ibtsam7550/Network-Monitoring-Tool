version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: network-monitor-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/config.yml:/app/config.yml:rw
      - monitor-logs:/app/logs
      - monitor-reports:/app/reports
      - monitor-data:/app/data
    environment:
      - CONFIG_PATH=/app/config.yml
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Karachi
      - ALLOWED_ORIGINS=*
    cap_add:
      - NET_RAW

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: network-monitor-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  monitor-logs:
  monitor-reports:
  monitor-data:
